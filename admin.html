<!DOCTYPE html>
<html>
<head>
  <title>Admin PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial, sans-serif; padding: 40px; background: #f4f4f4; margin: 0; }
.box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
button { padding: 10px 16px; background: #2c7be5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.deleteBtn { background: #dc3545; }
input[type="file"] { padding: 8px; margin: 5px 0 10px 0; width: 100%; }
li { margin: 12px 0; list-style: none; background: #f8f9fa; padding: 12px; border-radius: 6px; }

@media (max-width: 768px) {
  body { padding: 15px; }
  h1 { font-size: 22px; }
  .box { padding: 15px; margin-bottom: 20px; }
  button { width: 100%; margin-top: 8px; font-size: 15px; }
  li { display: flex; flex-direction: column; gap: 8px; }
  li a button, .deleteBtn { width: 100%; }
}
</style>
</head>

<body>

<div id="adminPanel" style="display:none;">
  <h1>📁 Gestion PDF</h1>

  <div class="box">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="uploadFile()">Uploader</button>
    <p id="status"></p>
  </div>

  <div class="box">
    <h2>Fichiers</h2>
    <ul id="fileList"></ul>
  </div>
</div>

<script>
/* 🔐 TOKEN ACCESS */

const ADMIN_TOKEN_HASH = "d8f4a1a767ce0c041f1a22a9e0c6bc726d0078e3dcf4ea98558d2c7d11efbaea";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function deny() {
  document.body.innerHTML = `
    <div style="text-align:center;padding:60px;font-family:Arial">
      <h2>⛔ Accès refusé</h2>
      <p>Lien invalide</p>
    </div>
  `;
}

async function checkAccess() {
  let token = new URLSearchParams(window.location.search).get("token");
  if (!token) return deny();

  token = decodeURIComponent(token); // FIX %
  const hash = await sha256(token);

  if (hash !== ADMIN_TOKEN_HASH) return deny();

  document.getElementById("adminPanel").style.display = "block";
  loadFiles();
}

/* ☁️ SUPABASE */

const supabaseClient = window.supabase.createClient(
  "https://smgzffkjwokcfjdejsbd.supabase.co",
  "sb_publishable_JzkhEKjWGzWGwN_310ukew_m5EW3HrW"
);

function cleanFileName(name) {
  return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9.\-_]/g, "_");
}

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Choisis un PDF");

  const status = document.getElementById("status");
  status.innerText = "Upload...";

  const filePath = Date.now() + "-" + cleanFileName(file.name);
  const { error } = await supabaseClient.storage.from("documents").upload(filePath, file);
  if (error) return status.innerText = "❌ Erreur upload";

  const { data } = supabaseClient.storage.from("documents").getPublicUrl(filePath);

  await supabaseClient.from("fichiers_pdf").insert({
    nom: file.name,
    url: data.publicUrl,
    chemin: filePath
  });

  status.innerText = "✅ Upload OK";
  loadFiles();
}

async function loadFiles() {
  const list = document.getElementById("fileList");
  if (!list) return;

  const { data } = await supabaseClient
    .from("fichiers_pdf")
    .select("*")
    .order("id", { ascending: false });

  list.innerHTML = "";

  if (!data || !data.length) {
    list.innerHTML = "<li>Aucun fichier</li>";
    return;
  }

  data.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${f.nom}
      <a href="${f.url}" target="_blank"><button>Télécharger</button></a>
      <button class="deleteBtn" onclick="deleteFile('${f.id}','${f.chemin}')">Supprimer</button>
    `;
    list.appendChild(li);
  });
}

async function deleteFile(id, chemin) {
  if (!confirm("Supprimer ce fichier ?")) return;
  await supabaseClient.storage.from("documents").remove([chemin]);
  await supabaseClient.from("fichiers_pdf").delete().eq("id", id);
  loadFiles();
}

document.addEventListener("DOMContentLoaded", checkAccess);
</script>

</body>
</html>
