<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial, sans-serif; padding: 40px; background: #f4f4f4; margin: 0; }
.box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
button { padding: 10px 16px; background: #2c7be5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.deleteBtn { background: #dc3545; }
input[type="file"], input { padding: 8px; margin: 5px 0 10px 0; width: 100%; }
li { margin: 12px 0; list-style: none; background: #f8f9fa; padding: 12px; border-radius: 6px; }
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginBox" style="display:none;max-width:400px;margin:auto;padding:40px">
  <h2>🔐 Connexion Admin</h2>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Mot de passe">
  <button id="loginBtn">Connexion</button>
  <p id="msg"></p>
</div>

<!-- 📁 ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <button onclick="logout()">Se déconnecter</button>

  <h1>📁 Gestion PDF</h1>

  <div class="box">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="uploadFile()">Uploader</button>
    <p id="status"></p>
  </div>

  <div class="box">
    <h2>Fichiers</h2>
    <ul id="fileList"></ul>
  </div>
</div>

<!-- 🔥 FIREBASE AUTH -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDYW9O1fV-yxqxENcGe0L1-0hZIQXlWV88",
  authDomain: "domiclean01.firebaseapp.com",
  projectId: "domiclean01",
  storageBucket: "domiclean01.firebasestorage.app",
  messagingSenderId: "1412105890",
  appId: "1:1412105890:web:3716be5c2af93a6eb8b9fb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const adminPanel = document.getElementById("adminPanel");

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, pass.value);
  } catch (e) {
    msg.innerText = "❌ " + e.message;
  }
};

onAuthStateChanged(auth, user => {
  if (user) {
    loginBox.style.display = "none";
    adminPanel.style.display = "block";
    loadFiles();
  } else {
    loginBox.style.display = "block";
    adminPanel.style.display = "none";
  }
});

window.logout = async () => await signOut(auth);
</script>

<!-- ☁️ SUPABASE -->
<script>
const supabaseClient = window.supabase.createClient(
  "https://smgzffkjwokcfjdejsbd.supabase.co",
  "sb_publishable_JzkhEKjWGzWGwN_310ukew_m5EW3HrW"
);

function cleanFileName(name) {
  return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9.\-_]/g, "_");
}

async function uploadFile() {
  const file = fileInput.files[0];
  if (!file) return alert("Choisis un PDF");
  if (file.type !== "application/pdf") return alert("Seulement PDF");
  if (file.size > 10 * 1024 * 1024) return alert("Max 10MB");

  status.innerText = "Upload...";
  const filePath = Date.now() + "-" + cleanFileName(file.name);

  const { error } = await supabaseClient.storage.from("documents").upload(filePath, file);
  if (error) return status.innerText = "❌ Erreur upload";

  const { data } = supabaseClient.storage.from("documents").getPublicUrl(filePath);

  await supabaseClient.from("fichiers_pdf").insert({
    nom: file.name,
    url: data.publicUrl,
    chemin: filePath
  });

  status.innerText = "✅ Upload OK";
  loadFiles();
}

async function loadFiles() {
  fileList.innerHTML = "";
  const { data } = await supabaseClient.from("fichiers_pdf").select("*").order("id", { ascending: false });

  if (!data || !data.length) return fileList.innerHTML = "<li>Aucun fichier</li>";

  data.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `${f.nom}
      <a href="${f.url}" target="_blank"><button>Télécharger</button></a>
      <button class="deleteBtn" onclick="deleteFile('${f.id}','${f.chemin}')">Supprimer</button>`;
    fileList.appendChild(li);
  });
}

async function deleteFile(id, chemin) {
  if (!confirm("Supprimer ?")) return;
  await supabaseClient.storage.from("documents").remove([chemin]);
  await supabaseClient.from("fichiers_pdf").delete().eq("id", id);
  loadFiles();
}
</script>

</body>
</html>
