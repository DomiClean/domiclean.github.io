<!DOCTYPE html>
<html>
<head>
  <title>Admin PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; padding:40px; background:#f4f4f4 }
    .box { background:white; padding:20px; border-radius:8px; margin-bottom:30px }
    button { padding:8px 14px; background:#2c7be5; color:white; border:none; border-radius:5px; cursor:pointer }
    .deleteBtn { background:#dc3545 }
    input { padding:8px; margin:5px 0 }
    li { margin:10px 0 }
  </style>
</head>
<body>

<div id="adminPanel">
  <h1>📁 Gestion PDF</h1>

  <div class="box">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="uploadFile()">Uploader</button>
    <p id="status"></p>
  </div>

  <div class="box">
    <h2>Fichiers</h2>
    <ul id="fileList"></ul>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://smgzffkjwokcfjdejsbd.supabase.co",
  "sb_publishable_JzkhEKjWGzWGwN_310ukew_m5EW3HrW"
);

function cleanFileName(name) {
  return name
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève accents
    .replace(/[^a-zA-Z0-9.\-_]/g, "_"); // garde seulement caractères safe
}

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Choisis un PDF");

  const status = document.getElementById("status");
  status.innerText = "Upload...";

  const safeName = cleanFileName(file.name);
  const filePath = Date.now() + "-" + safeName;

  const { error: uploadError } = await supabaseClient.storage
    .from("documents")
    .upload(filePath, file);

  if (uploadError) {
    console.error(uploadError);
    status.innerText = "❌ Erreur upload";
    return;
  }

  const { data: urlData } = supabaseClient.storage
    .from("documents")
    .getPublicUrl(filePath);

  await supabaseClient.from("fichiers_pdf").insert({
    nom: file.name,
    url: urlData.publicUrl,
    chemin: filePath
  });

  status.innerText = "✅ Upload OK";
  loadFiles();
}

async function loadFiles() {
  const { data, error } = await supabaseClient
    .from("fichiers_pdf")
    .select("*")
    .order("id", { ascending: false });

  const list = document.getElementById("fileList");
  list.innerHTML = "";

  if (error) {
    console.error(error);
    list.innerHTML = "<li>Erreur chargement</li>";
    return;
  }

  if (!data.length) {
    list.innerHTML = "<li>Aucun fichier</li>";
    return;
  }

  data.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${f.nom}
      <a href="${f.url}" target="_blank">
        <button>Télécharger</button>
      </a>
      <button class="deleteBtn"
        onclick="deleteFile('${f.id}', '${f.chemin}')">
        Supprimer
      </button>
    `;
    list.appendChild(li);
  });
}

async function deleteFile(id, chemin) {
  if (!confirm("Supprimer ce fichier ?")) return;

  const { error: storageError } = await supabaseClient.storage
    .from("documents") // ← corrigé
    .remove([chemin]);

  if (storageError) {
    console.error(storageError);
    alert("Erreur suppression storage");
    return;
  }

  const { error: dbError } = await supabaseClient
    .from("fichiers_pdf")
    .delete()
    .eq("id", id);

  if (dbError) {
    console.error(dbError);
    alert("Erreur suppression base");
    return;
  }

  loadFiles();
}

document.addEventListener("DOMContentLoaded", loadFiles);
</script>

</body>
</html>


</body>
</html>
