<style>
/* =====================================================================
   COULEURS — remplacez ces six valeurs par celles du :root de votre site
   pour que l'app soit au même vert / bleu que domiclean.github.io
   ===================================================================== */
:root{
  --accent:#1F6F5C;        /* couleur principale des boutons */
  --accent-deep:#0E3F34;   /* variante foncée, survol */
  --soft:#DCEDE6;          /* fond des éléments sélectionnés */
  --paper:#F1F5F3;         /* fond de l'application */
  --ink:#10242C;           /* texte principal */
  --ink-2:#556D75;         /* texte secondaire */

  --card:#FFFFFF;
  --line:#DBE5E2;
  --amber:#B87333;
  --amber-soft:#F6E7D6;
  --rouge:#9C3B2E;
  --rouge-soft:#F7E7E5;
  --shadow:0 1px 2px rgba(16,36,44,.06), 0 8px 24px -12px rgba(16,36,44,.18);
  --tab-h:66px;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:1.6rem}
h2{font-size:1.05rem}
h3{font-size:1rem;letter-spacing:-.01em}
p{margin:0 0 .75rem}
button{font:inherit;color:inherit}
a{color:var(--accent-deep)}

.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 20px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:-.02em}
.topbar .who{font-size:.78rem;color:var(--ink-2);max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;padding:6px 20px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar ul{max-width:560px;margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--ink-2);font-size:.7rem;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--accent-deep)}
.tabbar a[aria-current="page"] .ic{background:var(--soft)}
.ic{width:42px;height:26px;border-radius:999px;display:grid;place-items:center;transition:background .18s ease}
.ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.section{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.center{text-align:center}

.next{background:linear-gradient(168deg,var(--accent) 0%, var(--accent-deep) 100%);color:#fff;border:0;border-radius:22px;padding:22px;box-shadow:0 14px 30px -18px rgba(14,63,52,.9)}
.next .when{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.next .daynum{font-family:var(--display);font-size:3.1rem;line-height:.85;font-weight:700}
.next .dayrest{font-size:.92rem;opacity:.92;padding-bottom:4px}
.next .dayrest strong{display:block;font-weight:600;font-size:1.05rem}
.next dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.next dt{opacity:.72}
.next dd{margin:0}
.next .acts{display:flex;gap:10px;margin-top:18px}
.next .acts button{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:10px;font-size:.86rem;font-weight:500;cursor:pointer}
.next .acts button:hover{background:rgba(255,255,255,.22)}

.empty{border:1px dashed var(--line);background:#fff;border-radius:22px;padding:24px 20px}
.empty h2{margin-bottom:8px;font-size:1.25rem}

.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.shortcut{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:84px;justify-content:space-between}
.shortcut:hover{border-color:#c3d4cf}
.shortcut span{font-weight:500;font-size:.92rem}
.shortcut svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.visit{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:0;padding-bottom:0}
.visit .date{flex:0 0 52px;text-align:center;border-radius:12px;background:var(--soft);color:var(--accent-deep);padding:7px 0}
.visit .date b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1}
.visit .date i{font-style:normal;font-size:.68rem}
.visit .date.vide{background:#EDF1F0;color:var(--ink-2);font-size:1.3rem;line-height:1.7}
.visit .body{flex:1;min-width:0}
.visit h3{margin-bottom:2px}
.visit .meta{font-size:.85rem;color:var(--ink-2)}
.visit .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:7px}
.tag.ok{background:var(--soft);color:var(--accent-deep)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.done{background:#EDF1F0;color:var(--ink-2)}
.tag.off{background:var(--rouge-soft);color:var(--rouge)}

label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,92,.15)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{display:block;width:100%;padding:14px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:var(--accent-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--accent-deep);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--accent)}
.btn.slim{padding:11px;font-size:.9rem;width:auto;display:inline-block;padding-left:18px;padding-right:18px}
.btn.danger{background:#fff;color:var(--rouge);border:1px solid var(--line)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.choice:hover{border-color:#c3d4cf}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.choice .emo{flex:0 0 28px;font-size:1.35rem;line-height:1.2}
.choice b{display:block;font-weight:600;font-size:.97rem}
.choice em{font-style:normal;font-size:.84rem;color:var(--ink-2)}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.9rem}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent-deep);font-weight:600}

.steps{display:flex;align-items:center;gap:7px;margin:4px 0 18px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.stepno{font-size:.8rem;color:var(--ink-2);margin-bottom:5px}

.recap{background:var(--soft);border-radius:16px;padding:16px;margin:16px 0;font-size:.9rem}
.recap div{display:flex;justify-content:space-between;gap:16px;padding:3px 0}
.recap span:first-child{color:var(--accent-deep);opacity:.75}
.recap span:last-child{text-align:right;font-weight:500}

.doc{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:1.5}
.doc .body{flex:1;min-width:0}
.doc b{font-weight:500;font-size:.93rem;display:block}
.doc a{font-size:.85rem;font-weight:600;text-decoration:none}

.avis{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:12px 14px;font-size:.85rem;margin:14px 0}
.avis.rouge{background:var(--rouge-soft);color:var(--rouge)}
.liens{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:.78rem;margin-top:22px}
.liens a{color:var(--ink-2);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.backlink{background:none;border:0;padding:0;margin-bottom:14px;color:var(--ink-2);font-size:.88rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

        <path d="M12 9.2c1.9 1.9 2.9 3.2 2.9 4.5a2.9 2.9 0 0 1-5.8 0c0-1.3 1-2.6 2.9-4.5z" fill="#fff"/>

<script type="module">
/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
const CONFIG = {
  // Laissez tel quel pour tester en mode démo (données sur l'appareil).
  supabaseUrl: "https://smgzffkjwokcfjdejsbd.supabase.co",
  supabaseAnonKey: "sb_publishable_JzkhEKjWGzWGwN_310ukew_m5EW3HrW",

  telephone: "06 28 48 72 17",
  email: "domicleanidf@gmail.com",
  site: "https://domiclean.github.io/",
  // Le calendrier d'appel découverte du site. Remplacez par votre lien
  // Calendly direct si vous préférez ouvrir le calendrier sans passer par le site.
  reservationAppel: "https://domiclean.github.io/index.html#reservation",
  cgv: "https://domiclean.github.io/cgv.html",
  confidentialite: "https://domiclean.github.io/politique-confidentialite.html",
  mentions: "https://domiclean.github.io/mentions-legales.html",
  departements: ["75","77","78","91","92","93","94","95"]
};

const CATEGORIES = [
  { id:"nettoyage", emo:"🧹", nom:"Nettoyage", desc:"Locaux, chantier, vitrerie, déménagement" },
  { id:"aide",      emo:"🤝", nom:"Aide à domicile", desc:"Courses, administratif, compagnie, santé" }
];

const SERVICES = [
  { id:"locaux",       cat:"nettoyage", emo:"🏢", nom:"Locaux professionnels", desc:"Bureaux, commerces, espaces professionnels" },
  { id:"chantier",     cat:"nettoyage", emo:"🏗️", nom:"Fin de chantier",       desc:"Remise en état après travaux" },
  { id:"vitrerie",     cat:"nettoyage", emo:"🪟", nom:"Vitrerie",               desc:"Fenêtres, baies vitrées, vitrines" },
  { id:"demenagement", cat:"nettoyage", emo:"📦", nom:"Après déménagement",     desc:"Remise en état complète du logement" },
  { id:"courses",      cat:"aide",      emo:"🛒", nom:"Aide aux courses",       desc:"Vos courses selon votre liste" },
  { id:"administratif",cat:"aide",      emo:"📋", nom:"Aide administrative",    desc:"Courriers et démarches" },
  { id:"compagnie",    cat:"aide",      emo:"🎲", nom:"Compagnie & activités",  desc:"Jeux, lecture, promenades" },
  { id:"medical",      cat:"aide",      emo:"🏥", nom:"Accompagnement médical", desc:"Transport et présence aux rendez-vous" },
  { id:"lever",        cat:"aide",      emo:"🌅", nom:"Lever & coucher",        desc:"Assistance du matin et du soir" },
  { id:"medicaments",  cat:"aide",      emo:"💊", nom:"Prise de médicaments",   desc:"Rappel et assistance selon prescription" }
];

const RYTHMES = [
  { id:"ponctuel", emo:"📌", nom:"Une seule fois",      desc:"Intervention ponctuelle" },
  { id:"regulier", emo:"🔁", nom:"Régulièrement",       desc:"Chaque semaine ou tous les quinze jours" },
  { id:"aviser",   emo:"💬", nom:"Je ne sais pas encore", desc:"Nous en parlons pendant l'appel" }
];

const CRENEAUX = ["8h – 10h","10h – 12h","12h – 14h","14h – 16h","16h – 18h","18h – 20h"];

/* =====================================================================
   2. DONNÉES — Supabase si configuré, sinon démo locale
   ===================================================================== */
const configured = !CONFIG.supabaseUrl.startsWith("VOTRE_");
let sb = null;
if (configured) {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  sb = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
}

const LS = "domiclean.demo";
const demo = {
  read(){ try { return JSON.parse(localStorage.getItem(LS)) || { user:null, demandes:[] }; } catch { return { user:null, demandes:[] }; } },
  save(d){ localStorage.setItem(LS, JSON.stringify(d)); }
};

const store = {
  async user(){
    if (!sb) return demo.read().user;
    const { data } = await sb.auth.getUser();
    return data?.user ? { email:data.user.email, prenom:data.user.user_metadata?.prenom || "" } : null;
  },
  async signIn(email){
    if (!sb){ const d = demo.read(); d.user = { email, prenom:"" }; demo.save(d); return { ok:true, demo:true }; }
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:location.href.split("#")[0] } });
    return error ? { ok:false, error:error.message } : { ok:true };
  },
  async signOut(){ if (!sb){ const d = demo.read(); d.user = null; demo.save(d); return; } await sb.auth.signOut(); },
  async listDemandes(){
    if (!sb) return demo.read().demandes;
    const { data, error } = await sb.from("demandes").select("*").order("cree_le", { ascending:false });
    if (error){ console.error(error); return []; }
    return data.map(d => ({
      id:d.id, service:d.service, rythme:d.rythme, date:d.date_souhaitee, creneau:d.creneau,
      adresse:d.adresse, cp:d.code_postal, precisions:d.precisions, statut:d.statut,
      intervenant:d.intervenant, devis_chemin:d.devis_chemin, devis_montant:d.devis_montant,
      devis_accepte_le:d.devis_accepte_le, cree_le:d.cree_le
    }));
  },
  async createDemande(d){
    if (!sb){ const s = demo.read(); s.demandes.unshift({ ...d, id:crypto.randomUUID(), cree_le:new Date().toISOString() }); demo.save(s); return { ok:true }; }
    const { data:{ user } } = await sb.auth.getUser();
    const { error } = await sb.from("demandes").insert({
      user_id:user?.id ?? null, email:d.email, nom:d.nom, telephone:d.telephone,
      service:d.service, rythme:d.rythme, date_souhaitee:d.date || null, creneau:d.creneau || null,
      adresse:d.adresse, code_postal:d.cp, precisions:d.precisions, statut:"envoyee"
    });
    return error ? { ok:false, error:error.message } : { ok:true };
  },
  async majDemande(id, champs){
    if (!sb){ const s = demo.read(); const x = s.demandes.find(v => v.id === id); if (x) Object.assign(x, champs); demo.save(s); return; }
    await sb.from("demandes").update(champs).eq("id", id);
  },
  async listDocs(){
    if (!sb) return [];
    const { data, error } = await sb.from("documents").select("*").order("cree_le", { ascending:false });
    return error ? [] : data;
  },
  async docUrl(chemin){
    try {
      const { data, error } = await sb.storage.from("documents").createSignedUrl(chemin, 60);
      return error ? { error:error.message } : { url:data.signedUrl };
    } catch (e) { return { error:e.message }; }
  }
};

/* =====================================================================
   3. OUTILS
   ===================================================================== */
const $ = s => document.querySelector(s);
const view = $("#view");
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janv","févr","mars","avril","mai","juin","juil","août","sept","oct","nov","déc"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const euro = n => Number(n).toLocaleString("fr-FR", { style:"currency", currency:"EUR" });
const svc = id => SERVICES.find(s => s.id === id);
const paramEmail = new URLSearchParams(location.search).get("email") || "";
const ajd = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3400);
}

const STATUTS = {
  envoyee:      ["wait","Demande envoyée"],
  appel_prevu:  ["wait","Appel de découverte prévu"],
  devis_envoye: ["wait","Devis à valider"],
  devis_accepte:["ok","Devis accepté"],
  planifiee:    ["ok","Intervention planifiée"],
  terminee:     ["done","Terminée"],
  annulee:      ["off","Annulée"]
};
const tagStatut = s => { const m = STATUTS[s] || ["done", s]; return `<span class="tag ${m[0]}">${m[1]}</span>`; };
const estActive = d => !["terminee","annulee"].includes(d.statut);

/* Pénalités d'annulation, telles que fixées par vos CGV (article 6). */
function penalite(dateIso, creneau){
  if (!dateIso) return { taux:0, texte:"Cette demande n'est pas encore planifiée : l'annulation est sans frais." };
  const heure = parseInt((creneau || "8h").match(/\d+/)[0], 10);
  const debut = new Date(`${dateIso}T${String(heure).padStart(2, "0")}:00:00`);
  const restant = (debut - Date.now()) / 36e5;
  if (dateIso === ajd())  return { taux:100, texte:"Annulation le jour même : 100 % du montant du devis reste dû." };
  if (restant < 24)       return { taux:50,  texte:"Moins de 24 h avant l'intervention : 50 % du montant du devis reste dû." };
  if (restant < 48)       return { taux:30,  texte:"Entre 24 h et 48 h avant l'intervention : 30 % du montant du devis reste dû." };
  return { taux:0, texte:"Plus de 48 h avant l'intervention : annulation sans frais." };
}

/* =====================================================================
   4. ÉCRANS
   ===================================================================== */
const state = { user:null, demandes:[], docs:[], b:{ etape:1 } };

async function refresh(){
  state.user = await store.user();
  state.demandes = state.user ? await store.listDemandes() : [];
  $("#who").textContent = state.user ? state.user.email : "Île-de-France";
}

/* ---- Accueil ---- */
function ecranAccueil(){
  const actives = state.demandes.filter(estActive);
  const planifiee = actives.filter(d => d.statut === "planifiee" && d.date >= ajd()).sort((a,b) => a.date.localeCompare(b.date))[0];
  const aValider = actives.find(d => d.statut === "devis_envoye");
  const bonjour = new Date().getHours() < 18 ? "Bonjour" : "Bonsoir";

  let hero;
  if (planifiee){
    const d = new Date(planifiee.date + "T00:00:00");
    hero = `<section class="next">
      <div class="when">
        <div class="daynum">${d.getDate()}</div>
        <div class="dayrest"><strong>${JOURS[d.getDay()]}</strong>${MOIS[d.getMonth()]} · ${esc(planifiee.creneau || "horaire à confirmer")}</div>
      </div>
      <dl>
        <dt>Prestation</dt><dd>${esc(svc(planifiee.service)?.nom || planifiee.service)}</dd>
        <dt>Chez vous</dt><dd>${esc(planifiee.adresse)}</dd>
        ${planifiee.intervenant ? `<dt>Avec</dt><dd>${esc(planifiee.intervenant)}</dd>` : ""}
      </dl>
      <div class="acts">
        <button data-report="${planifiee.id}">Reporter</button>
        <button data-annuler="${planifiee.id}">Annuler</button>
      </div>
    </section>`;
  } else if (aValider){
    hero = `<section class="next">
      <h2 style="font-size:1.35rem;margin-bottom:8px">Votre devis est prêt</h2>
      <p style="opacity:.9;font-size:.92rem;margin-bottom:16px">${esc(svc(aValider.service)?.nom || "")}${aValider.devis_montant ? " · " + euro(aValider.devis_montant) : ""}. Valable 30 jours, sans engagement.</p>
      <div class="acts">
        ${aValider.devis_chemin ? `<button data-doc="${esc(aValider.devis_chemin)}">Lire le devis</button>` : ""}
        <button data-accepter="${aValider.id}">Accepter</button>
      </div>
    </section>`;
  } else {
    hero = `<section class="empty">
      <h2>Parlons de votre besoin</h2>
      <p class="muted small">Un appel gratuit de 30 minutes, puis un devis personnalisé sous 24 h. Sans engagement.</p>
      <a class="btn" href="${CONFIG.reservationAppel}" target="_blank" rel="noopener">Réserver l'appel gratuit</a>
      <a class="btn ghost" href="#/demande" style="margin-top:10px">Décrire mon besoin par écrit</a>
    </section>`;
  }

  const autres = actives.filter(d => d !== planifiee && d !== aValider);

  return `<h1 style="margin:10px 0 18px">${bonjour}${state.user?.prenom ? " " + esc(state.user.prenom) : ""}.</h1>
    ${hero}
    <div class="shortcuts">
      <button class="shortcut" data-go="#/demande">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nouvelle demande</span>
      </button>
      <button class="shortcut" data-appel>
        <svg viewBox="0 0 24 24"><path d="M6 3.8h3.4l1.7 4.3-2.1 1.5a11 11 0 0 0 5.4 5.4l1.5-2.1 4.3 1.7V18a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 6a2 2 0 0 1 2-2.2z"/></svg><span>${esc(CONFIG.telephone)}</span>
      </button>
      <button class="shortcut" data-go="#/suivi">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg><span>Suivre mes demandes</span>
      </button>
      <button class="shortcut" data-go="#/compte">
        <svg viewBox="0 0 24 24"><path d="M6.5 3.5h7.6L18.5 8v12.5h-12z"/><path d="M13.6 3.6V8.3h4.7"/></svg><span>Devis et factures</span>
      </button>
    </div>
    ${autres.length ? `<div class="section"><h2>En cours</h2></div><div class="card">${autres.map(ligne).join("")}</div>` : ""}
    ${liensLegaux()}`;
}

function ligne(d, avecActions = false){
  const dt = d.date ? new Date(d.date + "T00:00:00") : null;
  const s = svc(d.service);
  return `<article class="visit">
    <div class="date ${dt ? "" : "vide"}">${dt ? `<b>${dt.getDate()}</b><i>${MOIS[dt.getMonth()]}</i>` : (s?.emo || "🏠")}</div>
    <div class="body">
      <h3>${esc(s?.nom || d.service)}</h3>
      <div class="meta">${dt ? esc(d.creneau || "horaire à confirmer") : "Date à convenir"}${d.devis_montant ? " · " + euro(d.devis_montant) : ""}</div>
      <div class="meta">${esc(d.adresse)}</div>
      ${tagStatut(d.statut)}
      ${avecActions ? actionsDemande(d) : ""}
    </div>
  </article>`;
}

function actionsDemande(d){
  const a = [];
  if (d.statut === "devis_envoye"){
    if (d.devis_chemin) a.push(`<button class="btn ghost slim" data-doc="${esc(d.devis_chemin)}">Lire le devis</button>`);
    a.push(`<button class="btn slim" data-accepter="${d.id}">Accepter le devis</button>`);
  }
  if (["planifiee","devis_accepte"].includes(d.statut)){
    a.push(`<button class="btn ghost slim" data-report="${d.id}">Reporter</button>`);
    a.push(`<button class="btn danger slim" data-annuler="${d.id}">Annuler</button>`);
  }
  if (d.statut === "envoyee") a.push(`<button class="btn danger slim" data-annuler="${d.id}">Retirer la demande</button>`);
  return a.length ? `<div class="acts">${a.join("")}</div>` : "";
}

/* ---- Demande de devis ---- */
function ecranDemande(){
  const b = state.b, total = 4;
  const barre = `<div class="steps">${Array.from({ length:total }, (_, i) => `<i class="${i < b.etape ? "on" : ""}"></i>`).join("")}</div><div class="stepno">Étape ${b.etape} sur ${total}</div>`;
  let corps = "";

  if (b.etape === 1){
    corps = `<h1>De quoi avez-vous besoin ?</h1>
      <div class="choices" style="margin-top:16px">
        ${CATEGORIES.map(c => `<button class="choice" aria-pressed="${b.cat === c.id}" data-cat="${c.id}">
          <span class="emo">${c.emo}</span><span><b>${c.nom}</b><em>${c.desc}</em></span></button>`).join("")}
      </div>
      ${b.cat ? `<div class="choices" style="margin-top:14px">
        ${SERVICES.filter(s => s.cat === b.cat).map(s => `<button class="choice" aria-pressed="${b.service === s.id}" data-svc="${s.id}">
          <span class="emo">${s.emo}</span><span><b>${s.nom}</b><em>${s.desc}</em></span></button>`).join("")}
      </div>` : ""}`;
  }
  if (b.etape === 2){
    corps = `<h1>À quel rythme ?</h1>
      <p class="muted small" style="margin-top:8px">Rien n'est figé : nous ajustons ensemble pendant l'appel.</p>
      <div class="choices" style="margin-top:16px">
        ${RYTHMES.map(r => `<button class="choice" aria-pressed="${b.rythme === r.id}" data-rythme="${r.id}">
          <span class="emo">${r.emo}</span><span><b>${r.nom}</b><em>${r.desc}</em></span></button>`).join("")}
      </div>`;
  }
  if (b.etape === 3){
    corps = `<h1>Quand vous arrangerait-il ?</h1>
      <p class="muted small" style="margin-top:8px">Une préférence suffit. Nous confirmons le créneau exact après l'appel.</p>
      <div class="field" style="margin-top:16px"><label for="d-date">Date souhaitée (facultatif)</label>
        <input type="date" id="d-date" min="${new Date(Date.now() + 2 * 864e5).toISOString().slice(0,10)}" value="${b.date || ""}"></div>
      <label>Moment de la journée</label>
      <div class="slots">${CRENEAUX.map(c => `<button class="slot" aria-pressed="${b.creneau === c}" data-creneau="${c}">${c}</button>`).join("")}</div>`;
  }
  if (b.etape === 4){
    const s = svc(b.service), r = RYTHMES.find(x => x.id === b.rythme);
    corps = `<h1>Vos coordonnées</h1>
      <div class="field" style="margin-top:16px"><label for="d-nom">Nom et prénom</label><input id="d-nom" value="${esc(b.nom || "")}" autocomplete="name"></div>
      <div class="row">
        <div class="field"><label for="d-tel">Téléphone</label><input id="d-tel" type="tel" value="${esc(b.telephone || "")}" autocomplete="tel"></div>
        <div class="field"><label for="d-mail">E-mail</label><input id="d-mail" type="email" value="${esc(b.email || state.user?.email || paramEmail)}" autocomplete="email" ${state.user ? "readonly title=\"L'adresse de votre compte\"" : ""}></div>
      </div>
      <div class="row">
        <div class="field"><label for="d-cp">Code postal</label><input id="d-cp" inputmode="numeric" maxlength="5" value="${esc(b.cp || "")}" placeholder="93100"></div>
        <div class="field"><label for="d-adr">Ville</label><input id="d-adr" value="${esc(b.adresse || "")}" placeholder="Montreuil"></div>
      </div>
      <div class="field"><label for="d-note">Votre besoin en quelques mots</label><textarea id="d-note" placeholder="Surface, nombre de pièces, contraintes d'accès, personne accompagnée…">${esc(b.precisions || "")}</textarea></div>
      <div class="recap">
        <div><span>Prestation</span><span>${s.emo} ${esc(s.nom)}</span></div>
        <div><span>Rythme</span><span>${esc(r.nom)}</span></div>
        <div><span>Souhait</span><span>${b.date ? esc(new Date(b.date + "T00:00:00").toLocaleDateString("fr-FR")) : "à convenir"}${b.creneau ? " · " + esc(b.creneau) : ""}</span></div>
      </div>
      <p class="muted small">Nous revenons vers vous sous 24 h avec un devis gratuit et sans engagement. Vous pouvez aussi <a href="${CONFIG.reservationAppel}" target="_blank" rel="noopener">réserver directement l'appel de 30 minutes</a>.</p>`;
  }

  return `${b.etape > 1 ? '<button class="backlink" data-back>← Retour</button>' : ""}
    ${barre}${corps}
    <div style="margin-top:20px"><button class="btn" data-next ${valide() ? "" : "disabled"}>${b.etape === 4 ? "Envoyer ma demande" : "Continuer"}</button></div>`;
}

function valide(){
  const b = state.b;
  if (b.etape === 1) return !!b.service;
  if (b.etape === 2) return !!b.rythme;
  return true;
}

/* ---- Suivi ---- */
function ecranSuivi(){
  if (!state.user) return besoinConnexion("Connectez-vous pour suivre vos demandes et vos devis.");
  const actives = state.demandes.filter(estActive);
  const closes = state.demandes.filter(d => !estActive(d));
  return `<h1 style="margin:10px 0 4px">Mes demandes</h1>
    ${actives.length ? `<div class="section"><h2>En cours</h2></div><div class="card">${actives.map(d => ligne(d, true)).join("")}</div>`
      : `<div class="card" style="margin-top:18px"><p class="muted" style="margin:0">Aucune demande en cours. <a href="#/demande">En faire une</a>.</p></div>`}
    ${closes.length ? `<div class="section"><h2>Terminées</h2></div><div class="card">${closes.map(d => ligne(d)).join("")}</div>` : ""}
    ${liensLegaux()}`;
}

/* ---- Compte ---- */
function ecranCompte(){
  if (!state.user) return besoinConnexion("Recevez un lien de connexion par e-mail, sans mot de passe à retenir.");
  const docs = state.docs || [];
  return `<h1 style="margin:10px 0 16px">Mon compte</h1>
    <div class="card">
      <h3>Connexion</h3>
      <p class="muted small" style="margin:6px 0 14px">${esc(state.user.email)}</p>
      <button class="btn ghost slim" data-logout>Se déconnecter</button>
    </div>
    <div class="section"><h2>Devis et factures</h2></div>
    <div class="card">
      ${docs.length ? docs.map(d => `<div class="doc">
        <svg viewBox="0 0 24 24"><path d="M6.5 3.5h7.6L18.5 8v12.5h-12z"/><path d="M13.6 3.6V8.3h4.7"/></svg>
        <div class="body"><b>${esc(d.titre)}</b><span class="muted small">${esc(d.type || "Document")} · ${esc(new Date(d.cree_le).toLocaleDateString("fr-FR"))}</span></div>
        <a href="#" data-doc="${esc(d.chemin)}">Ouvrir</a></div>`).join("")
        : `<p class="muted small" style="margin:0">Vos devis et factures apparaîtront ici. Règlement par virement, espèces, chèque ou CESU.</p>`}
    </div>
    <div class="section"><h2>Nous joindre</h2></div>
    <div class="card">
      <p class="small" style="margin:0 0 12px">Une question, une réclamation ? Réponse sous 24 h, et sous 72 h ouvrées pour une réclamation écrite.</p>
      <a class="btn ghost" href="tel:${CONFIG.telephone.replace(/\s/g, "")}">${esc(CONFIG.telephone)}</a>
      <a class="small" href="mailto:${esc(CONFIG.email)}" style="display:block;margin-top:12px;text-align:center">${esc(CONFIG.email)}</a>
    </div>
    ${liensLegaux()}`;
}

function besoinConnexion(phrase){
  return `<h1 style="margin:10px 0 8px">Votre espace</h1>
    <p class="muted" style="margin-bottom:18px">${phrase}</p>
    <div class="card">
      <div class="field"><label for="c-mail">Votre e-mail</label><input id="c-mail" type="email" autocomplete="email" placeholder="vous@exemple.fr" value="${esc(paramEmail)}">
      ${paramEmail ? `<p class="muted small" style="margin:8px 0 0">C'est l'adresse qui a reçu votre devis.</p>` : ""}</div>
      <button class="btn" data-login>Recevoir mon lien</button>
      ${!configured ? `<p class="muted small center" style="margin:12px 0 0">Mode démo : vos données restent sur cet appareil.</p>` : ""}
    </div>
    ${liensLegaux()}`;
}

const liensLegaux = () => `<div class="liens">
  <a href="${CONFIG.site}" target="_blank" rel="noopener">Site</a>
  <a href="${CONFIG.cgv}" target="_blank" rel="noopener">CGV</a>
  <a href="${CONFIG.confidentialite}" target="_blank" rel="noopener">Confidentialité</a>
  <a href="${CONFIG.mentions}" target="_blank" rel="noopener">Mentions légales</a>
</div>`;

/* =====================================================================
   5. ROUTAGE
   ===================================================================== */
const ROUTES = { "/accueil":ecranAccueil, "/demande":ecranDemande, "/suivi":ecranSuivi, "/compte":ecranCompte };

async function render(){
  const route = location.hash.replace("#", "") || "/accueil";
  if (route === "/compte" && state.user && sb) state.docs = await store.listDocs();
  view.innerHTML = (ROUTES[route] || ecranAccueil)();
  document.querySelectorAll(".tabbar a").forEach(a => {
    if (a.getAttribute("href") === "#" + route) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);

/* =====================================================================
   6. INTERACTIONS
   ===================================================================== */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-cat],[data-svc],[data-rythme],[data-creneau],[data-next],[data-back],[data-go],[data-appel],[data-login],[data-logout],[data-report],[data-annuler],[data-accepter],[data-doc]");
  if (!t) return;
  const b = state.b;

  if (t.dataset.go){ location.hash = t.dataset.go; return; }
  if (t.hasAttribute("data-appel")){ location.href = "tel:" + CONFIG.telephone.replace(/\s/g, ""); return; }

  if (t.dataset.cat){ b.cat = t.dataset.cat; if (svc(b.service)?.cat !== b.cat) b.service = null; return render(); }
  if (t.dataset.svc){ b.service = t.dataset.svc; return render(); }
  if (t.dataset.rythme){ b.rythme = t.dataset.rythme; return render(); }
  if (t.dataset.creneau){ b.creneau = b.creneau === t.dataset.creneau ? null : t.dataset.creneau; b.date = $("#d-date")?.value || b.date; return render(); }
  if (t.hasAttribute("data-back")){ b.etape--; return render(); }

  if (t.hasAttribute("data-next")){
    if (b.etape === 3) b.date = $("#d-date")?.value || "";
    if (b.etape < 4){ b.etape++; return render(); }

    b.nom = $("#d-nom").value.trim();
    b.telephone = $("#d-tel").value.trim();
    b.email = $("#d-mail").value.trim();
    b.cp = $("#d-cp").value.trim();
    b.adresse = $("#d-adr").value.trim();
    b.precisions = $("#d-note").value.trim();
    if (!b.nom || !b.telephone || !b.email || !b.cp || !b.adresse) return toast("Nom, téléphone, e-mail, code postal et ville sont nécessaires.");
    if (!CONFIG.departements.includes(b.cp.slice(0, 2)))
      if (!confirm("Ce code postal est hors Île-de-France. Nous pouvons étudier la demande, mais l'intervention reste soumise à notre accord préalable. Continuer ?")) return;

    t.disabled = true; t.textContent = "Envoi…";
    const res = await store.createDemande({ ...b, statut:"envoyee" });
    if (!res.ok){ t.disabled = false; t.textContent = "Envoyer ma demande"; return toast("L'envoi a échoué. Réessayez ou appelez-nous."); }
    state.b = { etape:1 };
    await refresh();
    toast("Demande reçue. Devis sous 24 h.");
    location.hash = "/accueil";
    return render();
  }

  if (t.hasAttribute("data-login")){
    const mail = $("#c-mail").value.trim();
    if (!mail.includes("@")) return toast("Entrez une adresse e-mail valide.");
    t.disabled = true;
    const r = await store.signIn(mail);
    t.disabled = false;
    if (!r.ok) return toast("Envoi impossible : " + r.error);
    if (r.demo){ await refresh(); return render(); }
    toast("Lien envoyé. Ouvrez votre boîte mail.");
    return;
  }
  if (t.hasAttribute("data-logout")){ await store.signOut(); await refresh(); return render(); }

  if (t.dataset.accepter){
    const d = state.demandes.find(x => x.id === t.dataset.accepter);
    if (!confirm(`En acceptant, vous validez le devis par écrit au sens de nos CGV${d?.devis_montant ? ` (${euro(d.devis_montant)})` : ""}. Confirmer ?`)) return;
    await store.majDemande(d.id, { statut:"devis_accepte", devis_accepte_le:new Date().toISOString() });
    await refresh(); toast("Devis accepté. Nous planifions l'intervention."); return render();
  }

  if (t.dataset.report){
    const d = state.demandes.find(x => x.id === t.dataset.report);
    const p = penalite(d.date, d.creneau);
    if (!confirm(`Demander un report ?\n\n${p.taux ? "Attention : " + p.texte + " Un report convenu avec nous reste sans frais." : p.texte}`)) return;
    await store.majDemande(d.id, { statut:"devis_accepte", date_souhaitee:null });
    await refresh(); toast("Report demandé. Nous vous rappelons."); return render();
  }

  if (t.dataset.annuler){
    const d = state.demandes.find(x => x.id === t.dataset.annuler);
    const p = penalite(d.date, d.creneau);
    if (!confirm(`Annuler cette ${d.statut === "envoyee" ? "demande" : "intervention"} ?\n\n${p.texte}`)) return;
    await store.majDemande(d.id, { statut:"annulee" });
    await refresh(); toast(p.taux ? "Annulée. Nous vous recontactons." : "Annulée, sans frais."); return render();
  }

  if (t.dataset.doc){
    e.preventDefault();
    if (!sb) return toast("Le devis sera consultable ici une fois la base connectée.");
    toast("Ouverture du document…");
    const r = await store.docUrl(t.dataset.doc);
    if (r.error) return toast("Document indisponible : " + r.error);
    // Même onglet : les navigateurs bloquent un nouvel onglet ouvert après un appel réseau.
    location.href = r.url;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "d-date"){ state.b.date = e.target.value; render(); }
});

/* =====================================================================
   7. DÉMARRAGE
   ===================================================================== */
if (sb) sb.auth.onAuthStateChange(async () => { await refresh(); render(); });
await refresh();
await render();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
