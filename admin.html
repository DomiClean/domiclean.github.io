<!DOCTYPE html>
<html>
<head>
  <title>Admin PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <style>
  body {
    font-family: Arial, sans-serif;
    padding: 40px;
    background: #f4f4f4;
    margin: 0;
  }

  .box {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 30px;
  }

  button {
    padding: 10px 16px;
    background: #2c7be5;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .deleteBtn {
    background: #dc3545;
  }

  input[type="file"] {
    padding: 8px;
    margin: 5px 0 10px 0;
    width: 100%;
  }

  li {
    margin: 12px 0;
    list-style: none;
    background: #f8f9fa;
    padding: 12px;
    border-radius: 6px;
  }

  /* 📱 MOBILE */
  @media (max-width: 768px) {
    body {
      padding: 15px;
    }

    h1 {
      font-size: 22px;
    }

    .box {
      padding: 15px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      margin-top: 8px;
      font-size: 15px;
    }

    li {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li a button,
    .deleteBtn {
      width: 100%;
    }
  }
</style>

</head>
<body>

<div id="adminPanel">
  <h1>📁 Gestion PDF</h1>

  <div class="box">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="uploadFile()">Uploader</button>
    <p id="status"></p>
  </div>

  <div class="box">
    <h2>Fichiers</h2>
    <ul id="fileList"></ul>
  </div>
</div>

  <script>
const ADMIN_TOKEN_HASH = "9e7c4cdc1a19ecfdbc4c6abf72eb5420a76c3c252356c99e221d348ff799a9d9";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

async function checkAccess() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) return deny();

  const hash = await sha256(token);

  if (hash !== ADMIN_TOKEN_HASH) return deny();

  // ✅ Accès autorisé
  document.getElementById("adminPanel").style.display = "block";
  loadFiles();
}

function deny() {
  document.body.innerHTML = `
    <div style="text-align:center;padding:60px;font-family:Arial">
      <h2>⛔ Accès refusé</h2>
      <p>Lien invalide</p>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("adminPanel").style.display = "none";
  checkAccess();
});
</script>


<script>
const supabaseClient = window.supabase.createClient(
  "https://smgzffkjwokcfjdejsbd.supabase.co",
  "sb_publishable_JzkhEKjWGzWGwN_310ukew_m5EW3HrW"
);

function cleanFileName(name) {
  return name
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève accents
    .replace(/[^a-zA-Z0-9.\-_]/g, "_"); // garde seulement caractères safe
}

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Choisis un PDF");

  const status = document.getElementById("status");
  status.innerText = "Upload...";

  const safeName = cleanFileName(file.name);
  const filePath = Date.now() + "-" + safeName;

  const { error: uploadError } = await supabaseClient.storage
    .from("documents")
    .upload(filePath, file);

  if (uploadError) {
    console.error(uploadError);
    status.innerText = "❌ Erreur upload";
    return;
  }

  const { data: urlData } = supabaseClient.storage
    .from("documents")
    .getPublicUrl(filePath);

  await supabaseClient.from("fichiers_pdf").insert({
    nom: file.name,
    url: urlData.publicUrl,
    chemin: filePath
  });

  status.innerText = "✅ Upload OK";
  loadFiles();
}

async function loadFiles() {
  const { data, error } = await supabaseClient
    .from("fichiers_pdf")
    .select("*")
    .order("id", { ascending: false });

  const list = document.getElementById("fileList");
  list.innerHTML = "";

  if (error) {
    console.error(error);
    list.innerHTML = "<li>Erreur chargement</li>";
    return;
  }

  if (!data.length) {
    list.innerHTML = "<li>Aucun fichier</li>";
    return;
  }

  data.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${f.nom}
      <a href="${f.url}" target="_blank">
        <button>Télécharger</button>
      </a>
      <button class="deleteBtn"
        onclick="deleteFile('${f.id}', '${f.chemin}')">
        Supprimer
      </button>
    `;
    list.appendChild(li);
  });
}

async function deleteFile(id, chemin) {
  if (!confirm("Supprimer ce fichier ?")) return;

  const { error: storageError } = await supabaseClient.storage
    .from("documents") // ← corrigé
    .remove([chemin]);

  if (storageError) {
    console.error(storageError);
    alert("Erreur suppression storage");
    return;
  }

  const { error: dbError } = await supabaseClient
    .from("fichiers_pdf")
    .delete()
    .eq("id", id);

  if (dbError) {
    console.error(dbError);
    alert("Erreur suppression base");
    return;
  }

  loadFiles();
}

document.addEventListener("DOMContentLoaded", loadFiles);
</script>

</body>
</html>
