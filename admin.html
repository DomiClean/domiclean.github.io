<!DOCTYPE html>
<html lang="fr">
<head>
<style>

    /* =========================
   RESET & BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  background-color: #f4f6f8;
  color: #2c3e50;
  padding: 40px;
}

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 1100px;
  margin: auto;
}

/* =========================
   TITRES
========================= */
h1 {
  font-size: 26px;
  margin-bottom: 10px;
  color: #1f3c88;
}

h2 {
  font-size: 18px;
  margin-bottom: 20px;
  color: #2c3e50;
}

/* =========================
   CARTES
========================= */
.card {
  background: #ffffff;
  border-radius: 8px;
  padding: 25px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  margin-bottom: 30px;
}

/* =========================
   FORMULAIRES
========================= */
form {
  display: grid;
  gap: 15px;
}

input, select, textarea {
  padding: 12px 14px;
  border: 1px solid #ccd1d9;
  border-radius: 5px;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #1f3c88;
}

/* =========================
   BOUTONS
========================= */
button {
  background: #1f3c88;
  color: #fff;
  padding: 12px 20px;
  border: none;
  border-radius: 5px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #162e66;
}

/* =========================
   TABLEAU ADMIN
========================= */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th {
  background: #1f3c88;
  color: #fff;
  padding: 12px;
  font-size: 13px;
  text-align: left;
}

td {
  padding: 12px;
  border-bottom: 1px solid #e0e4e8;
  font-size: 14px;
}

tr:hover {
  background: #f2f4f7;
}

/* =========================
   STATUT DEVIS
========================= */
.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.status.brouillon {
  background: #e0e0e0;
  color: #555;
}

.status.envoye {
  background: #dbeafe;
  color: #1e40af;
}

.status.accepte {
  background: #dcfce7;
  color: #166534;
}

.status.refuse {
  background: #fee2e2;
  color: #991b1b;
}

/* =========================
   HEADER ADMIN
========================= */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.header span {
  font-weight: 600;
  color: #16a085;
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 768px) {
  body {
    padding: 20px;
  }

  table, thead, tbody, th, td, tr {
    display: block;
  }

  tr {
    margin-bottom: 15px;
  }

  th {
    display: none;
  }

  td {
    padding: 10px;
  }
}
</style>
  <meta charset="UTF-8">
  <title>Admin DomiClean</title>
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>Panel Admin – DomiClean</h1>
      <span>Administration</span>
    </div>

    <!-- LOGIN -->
    <div id="login" class="card">
      <h2>Connexion administrateur</h2>
      <form onsubmit="event.preventDefault(); login();">
        <input type="email" id="email" placeholder="Email administrateur" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit">Connexion</button>
      </form>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none">

      <div class="card">
        <h2>Gestion des devis</h2>
        <table id="devisTable">
  <thead>
    <tr>
      <th>Client</th>
      <th>Email</th>
      <th>Total TTC</th>
      <th>Statut</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

      </div>

    </div>

  </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>

</html>
